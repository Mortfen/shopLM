services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hobbyshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hobbyshop-net

volumes:
  pgdata:

networks:
  hobbyshop-net:
    name: hobbyshop-net